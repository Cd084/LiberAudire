# Builds the signed APK.
# - Push a tag like v0.2.0: builds it and attaches it to that GitHub Release
#   (0.x versions are marked pre-release).
# - Run manually (Actions > Release > Run workflow): builds it as a
#   downloadable artifact, without making a release.
# Signing key from the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD
# repository secrets.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK platform 37.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" > /dev/null
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/liberaudire.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=liberaudire\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/liberaudire.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > key.properties
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
      - name: Name the APK
        id: apk
        run: |
          version=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/LiberAudire-$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/liberaudire.jks" key.properties
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          fail_on_unmatched_files: true
